<!DOCTYPE html>
<html lang="en">
<head>
    <title>AquaSentinel: Vellore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style> body { background-color: #0f172a; color: #e2e8f0; } </style>
</head>
<body class="p-6">
    <div class="max-w-7xl mx-auto space-y-6">
        <h1 class="text-3xl font-bold text-blue-400">💧 AquaSentinel: Python Engine</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-slate-800 p-5 rounded-lg space-y-4">
                <h2 class="text-xl font-semibold">Inputs</h2>
                <label>Rainfall (mm): <input type="range" id="rain" min="0" max="100" value="10" class="w-full" onchange="runSimulation()"></label>
                <label>Test Kits: <input type="number" id="kits" value="20" class="w-full bg-slate-700 text-white" onchange="runSimulation()"></label>
                <label>Tankers: <input type="number" id="tankers" value="5" class="w-full bg-slate-700 text-white" onchange="runSimulation()"></label>
                <h2 class="text-xl font-semibold pt-4 border-t border-slate-600">What-If Infrastructure</h2>
                <label>New Pipelines (%): <input type="range" id="pipe" min="0" max="100" value="0" class="w-full" onchange="runSimulation()"></label>
                <label>New Sewers (%): <input type="range" id="sewer" min="0" max="100" value="0" class="w-full" onchange="runSimulation()"></label>
            </div>

            <div class="md:col-span-2 space-y-6">
                <div id="map" style="height: 400px; border-radius: 8px; z-index: 1;"></div>
                <div class="bg-slate-800 p-5 rounded-lg">
                    <h2 class="text-xl font-semibold mb-2">Triage Queue (Greedy Knapsack)</h2>
                    <table class="w-full text-left">
                        <thead><tr class="border-b border-slate-600"><th>Ward</th><th>Risk</th><th>Data Trust</th><th>Action</th></tr></thead>
                        <tbody id="triageBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const map = L.map('map').setView([12.915, 79.135], 12);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
        let markers = [];

        async function runSimulation() {
            const payload = {
                rainfall: parseInt(document.getElementById('rain').value),
                test_kits: parseInt(document.getElementById('kits').value),
                tankers: parseInt(document.getElementById('tankers').value),
                pipe_upgrade: parseInt(document.getElementById('pipe').value),
                sewer_upgrade: parseInt(document.getElementById('sewer').value)
            };

            const response = await fetch('/api/simulate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();

            markers.forEach(m => map.removeLayer(m));
            markers = [];
            document.getElementById('triageBody').innerHTML = '';

            data.wards.forEach(w => {
                let color = w.risk_score > 0.6 ? '#EF553B' : (w.risk_score > 0.3 ? '#FFA15A' : '#00CC96');
                let circle = L.circle([w.lat, w.lon], { color: color, fillColor: color, fillOpacity: 0.7, radius: 100 + (w.risk_score * 400) }).addTo(map);
                markers.push(circle);

                let actions = [];
                if (w.kit_assigned) actions.push("🧪 Kit");
                if (w.tanker_assigned) actions.push("🚛 Tanker");

                if (actions.length > 0) {
                    document.getElementById('triageBody').innerHTML += `
                        <tr class="border-b border-slate-700">
                            <td>${w.id}</td><td>${w.risk_score.toFixed(2)}</td><td>${w.confidence}</td><td class="text-blue-400">${actions.join(" + ")}</td>
                        </tr>`;
                }
            });
        }
        window.onload = runSimulation;
    </script>
</body>
</html>
